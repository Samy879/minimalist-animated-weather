name: Update KDE Store Downloads Badge and History

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Playwright & Xvfb)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: Fetch downloads, generate JSON and update History
        run: |
          cat << 'EOF' > fetch_downloads.py
          import json
          import sys
          from playwright.sync_api import sync_playwright

          def main():
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=False)
                  context = browser.new_context(
                      user_agent="Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0",
                      viewport={"width": 1280, "height": 720}
                  )
                  page = context.new_page()
                  try:
                      page.goto("https://store.kde.org/p/2356087/loadFiles")
                      page.wait_for_function("() => document.body.innerText.includes('downloaded_count_uk')", timeout=20000)
                      content = page.locator("body").inner_text()
                      data = json.loads(content)
                      total = sum(int(f.get("downloaded_count_uk", 0)) for f in data.get("files", []))
                      print(total)
                  except Exception as e:
                      print(f"Erreur Playwright : {e}", file=sys.stderr)
                      sys.exit(1)
                  finally:
                      browser.close()

          if __name__ == "__main__":
              main()
          EOF

          TOTAL=$(xvfb-run python fetch_downloads.py)
          
          echo "Total des téléchargements récupéré : $TOTAL"

          echo "{\"schemaVersion\": 1, \"label\": \"Downloads\", \"message\": \"$TOTAL\", \"color\": \"blue\"}" > downloads-badge.json

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ ! -f downloads-history.csv ]; then
            echo "timestamp,downloads" > downloads-history.csv
          fi

          echo "$TIMESTAMP,$TOTAL" >> downloads-history.csv

          rm fetch_downloads.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add downloads-badge.json
          git add downloads-history.csv
          
          git commit -m "chore: update downloads badge and history" || exit 0
          git push origin HEAD:data
